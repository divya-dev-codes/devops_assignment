
groups:
  - name: infrastructure-alerts
    rules:
      - alert: EC2ExporterDown
        expr: up{job="ec2-node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EC2 Node Exporter is down"

      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance)
          (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EC2 CPU usage is above 80%"

      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EC2 disk space is running low"

  - name: application-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="nodejs-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node.js application is unavailable"

      - alert: HighApplicationErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Application HTTP 5xx error rate exceeds 5%"
